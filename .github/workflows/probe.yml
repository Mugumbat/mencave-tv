name: Probe data sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Bible Gateway verse of the day
        run: |
          date -u
          curl -s --max-time 20 "https://www.biblegateway.com/votd/get/?format=json&version=NIV" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['votd']
          for k,v in d.items():
              s=str(v)
              print(k,'=',s[:60] if k not in ('text','content') else s[:25]+'...')
          "
          curl -sI --max-time 20 "https://www.biblegateway.com/votd/get/?format=json&version=NIV" | grep -iE 'cache-control|age:|expires|date:'
